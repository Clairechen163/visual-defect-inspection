[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-inspector"
version = "0.1.0"
description = "Visual defect inspection for manufactured parts: scratches, discoloration and edge chips"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["opencv-python-headless>=4.7", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
defect-inspect = "defect_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
