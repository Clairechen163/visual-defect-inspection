[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-inspector"
version = "0.1.0"
description = "Visual defect inspection with from-scratch ML, statistical model comparison, cost-based decisions and SPC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["opencv-python-headless>=4.7", "numpy>=1.23"]

[project.optional-dependencies]
ml = ["matplotlib>=3.6", "scipy>=1.9"]
notebook = ["matplotlib>=3.6", "scipy>=1.9", "jupyter"]
dev = ["pytest>=7", "matplotlib>=3.6", "scipy>=1.9"]

[project.scripts]
defect-inspect = "defect_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
